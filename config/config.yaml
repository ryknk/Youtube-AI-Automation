# 最終動画の出力設定
video:
  # 動画の横幅（ピクセル）
  width: 1920
  # 動画の高さ（ピクセル）
  height: 1080
  # 動画のフレームレート
  fps: 30
  # 動画の出力形式
  output_format: mp4

# 機能ごとに使用するプロバイダー
providers:
  # 台本・シーン分割・メタデータ生成のプロバイダー
  text: openai
  # 音声合成のプロバイダー
  tts: voicevox
  # 画像生成のプロバイダー
  image:
    scene: qwen_image_nunchaku_local
    thumbnail: bfl

# テキスト生成モデルの設定
text:
  # 台本生成に使用するモデル
  script_model: gpt-5.6
  # 台本のシーン分割に使用するモデル
  scene_split_model: gpt-5.6
  # タイトル・説明文などのメタデータ生成に使用するモデル
  metadata_model: gpt-5.6

# 画像生成の共通設定（表現方針は各テンプレートで定義）
image:
  # 1動画で生成するシーン画像の最大枚数
  max_count: 50
  # シーン画像の生成に使用するモデル
  scene_model: flux-2-pro
  # サムネイル画像の生成に使用する高品質モデル
  thumbnail_model: flux-2-pro
  # OpenAI画像プロバイダーへ戻した場合に使用するモデル
  openai_model: gpt-image-2
  # シーン画像の生成サイズ（最終動画の解像度に合わせる。変更しないこと）
  scene_size: 1920x1080
  # サムネイル画像の生成サイズ
  thumbnail_size: 1280x720
  # OpenAI画像プロバイダーへ戻した場合の生成品質
  quality: high
  # 1シーン内で1枚の画像を表示する最小秒数（字幕の自然な区切りをこの秒数未満では切り替えない）
  min_display_seconds: 3.0
  # 1シーン内で1枚の画像を表示する最大秒数（この秒数を超える前に次の画像へ切り替える）
  max_display_seconds: 15.0
  # シーン画像プロンプト用の場面説明生成（providers.text が openai の場合のみ利用可）。
  # trueにすると、画像プロンプトへ生の日本語ナレーション文をそのまま渡す代わりに、OpenAIで
  # 生成した短い英語の場面説明を渡す。Qwen-Image等の文字レンダリング精度が高いモデルが、
  # ナレーション文をそのまま字幕のように画面へ描画してしまう問題への対策。
  # 動画1本につきOpenAI APIを1回のみ呼び出し、まとめて生成する
  # （追加課金あり）。
  scene_description:
    enabled: true
    # nullの場合はtext.scene_split_modelを使用する。
    model: null
  # シーン画像生成後の編集（後処理）ステップ。字幕・キャプション風の文字が写り込んだ場合に
  # 除去する用途。既定は無効（スキップ）。有効化するとシーン画像1枚ごとに追加の推論が発生し、
  # 処理時間が大きく増加する（実測: RTX 4070/12GBでnum_inference_steps=8のとき約107秒/枚。
  # 別途モデルダウンロード・ロードで初回のみ約13分、ディスク使用量+約27GBが必要）。
  scene_edit:
    enabled: false
    # 現状qwen_image_edit_nunchaku_localのみ対応。
    provider: qwen_image_edit_nunchaku_local
  # scene_edit.provider が qwen_image_edit_nunchaku_local の場合のみ使用される。
  # nunchaku(SVDQuant 4bit量子化)版Qwen-Image-Edit-2509による画像編集用の設定。
  # CUDA専用（CPU実行は非対応）。qwen_image_nunchaku_localと同じ任意依存関係を使う。
  qwen_image_edit_nunchaku_local:
    base_model_id: Qwen/Qwen-Image-Edit-2509
    transformer_repo_id: nunchaku-tech/nunchaku-qwen-image-edit-2509
    # auto: nunchaku.utils.get_precision()でGPU世代から自動判定
    # （Blackwell/50シリーズはnvfp4、それ以外はint4）。int4 / nvfp4 も明示指定可。
    precision: auto
    # 32: 高速（軽量） / 128: 高品質（重い）
    rank: 128
    # 4 または 8 を指定するとその step数専用のLightning蒸留版を使用する（推奨・高速）。
    # nullにすると非蒸留版を使用し、num_inference_stepsを自由に指定できる
    # （未指定時は40 stepsを既定値として使用、処理時間はさらに増加する）。
    lightning_steps: 8
    # nullの場合はlightning_stepsの値（8）を使用する。
    num_inference_steps: null
    true_cfg_scale: 4.0
    # 編集時の推論解像度。未指定（null）の場合、providers.image.sceneで選択中の画像生成
    # プロバイダー（qwen_image_local / qwen_image_nunchaku_local等、width/heightを持つもの
    # ならどれでも対象）のwidth/height設定から自動的に決定される
    # （PluginManager.create_image_editor参照）。シーン画像は生成解像度のまま保存されるため、
    # 通常は画像ファイル自体のサイズと一致するが、生成プロバイダーの設定変更に編集側を
    # 追従させconfig.yaml内での二重管理を避けるためにこの仕組みがある。編集後は編集対象
    # 画像と同じ解像度へ戻して保存するため、最終的な出力サイズはこの設定に依存しない。
    # 明示的に指定するとその値が自動決定より優先される。
    width: null
    height: null
    # 除去・編集内容を指示するプロンプト。既定値は字幕・キャプション帯の除去指示。
    # 実測では、下部の帯を除去した領域が反転コピー（鏡写し）のようになる副作用が確認できた
    # ため、それを避ける指示を含めている。必要に応じて調整すること。
    prompt: >-
      Remove the black caption bar and any text at the bottom of the image.
      Naturally extend the existing floor, wall, table, or background so the
      removed area blends in, matching the surrounding lighting and
      perspective. Do not mirror or duplicate any other part of the image.
      Do not change anything else in the image.
    # Qwen-Image-Edit系は空文字列だとエラーになるため半角スペースを既定値とする。
    negative_prompt: " "
    # 任意の参照画像パス。設定すると、編集対象画像に加えこの画像もQwenImageEditPlusPipeline
    # （2509の複数画像入力に対応したパイプライン）へ渡し、promptで参照画像の要素（例:
    # 統一デザインのキャラクター）を編集対象画像へ反映させられる。既定はnull（未使用、
    # 編集対象画像1枚のみで編集する従来動作）。テンプレート単位で使う場合は
    # templates/<template>/video.yamlのimage.qwen_image_edit_nunchaku_local.reference_image
    # で上書きする（相対パスはそのテンプレートのディレクトリ基準で解決される。例:
    # templates/psychology/video.yaml）。
    reference_image: null
    # 公式サンプルのしきい値（GB）。GPU VRAMがこれを超える場合はenable_model_cpu_offload、
    # 以下の場合はtransformer.set_offload+enable_sequential_cpu_offloadを使う。
    offload_threshold_gb: 18.0
    low_vram_use_pin_memory: false
    low_vram_num_blocks_on_gpu: 1
    # nullの場合は毎回ランダムなseedを使用する
    seed: null
    # nullの場合はHugging Faceの既定キャッシュ（%USERPROFILE%\.cache\huggingface\hub）を使用する
    model_cache_dir: huggingface\model_cache\Qwen-Image-Edit-2509-nunchaku
  # BFL画像プロバイダー（providers.image が bfl の場合）用の設定。
  bfl:
    # 任意のプロンプト追記文字列。プロンプト末尾に ", <prompt_suffix>" として付加される。
    # 既定（未指定時）は空文字列（何も付加しない）。
    # 例: 画面内への意図しない文字描画を防ぐ "No text." など。
    prompt_suffix: "No text."
  # OpenAI画像プロバイダー（providers.image が openai の場合）用の設定。
  openai:
    # 任意のプロンプト追記文字列。プロンプト末尾に ", <prompt_suffix>" として付加される。
    # 既定（未指定時）は空文字列（何も付加しない）。
    # 例: 画面内への意図しない文字描画を防ぐ "No text." など。
    prompt_suffix: "No text."
  # FLUX.1 Schnell Self-host（ローカルGPU実行）用の設定。
  # providers.image（またはproviders.image.scene/thumbnail）を flux_schnell_local に
  # した場合のみ使用される。詳細はREADME.mdの「FLUX.1 Schnell Self-host」を参照。
  flux_schnell_local:
    # VAE/テキストエンコーダ(CLIP L, T5xxl)/tokenizer/schedulerの取得元となるベースモデル。
    # transformer_pathを指定した場合、transformer本体のみ差し替わりこちらは変わらない。
    model_id: black-forest-labs/FLUX.1-schnell
    # Civitai等で配布される、transformer(拡散モデル本体)のみを含む単一safetensorsのローカルパス。
    # nullの場合はmodel_idのtransformerをそのまま使用する。
    # 例: PixelWave FLUX.1 schnell version 04 (bf16) を使う場合
    transformer_path: huggingface\checkpoints\pixelwave_flux1Schnell04.safetensors
    # auto: CUDA検出時はcuda、未検出時はallow_cpu次第でcpu / cuda / cpu / mps を明示指定も可
    device: auto
    # auto: cuda時はbfloat16、cpu時はfloat32 / float16 / bfloat16 / float32 も指定可
    dtype: auto
    num_inference_steps: 8
    guidance_scale: 0.0
    # モデルへ渡す生成サイズ（scene_size/thumbnail_sizeとは独立。生成後にcover+中央クロップで整形する）
    width: 1344
    height: 768
    # nullの場合は毎回ランダムなseedを使用し、実際に使用したseedをログ・画像メタデータへ記録する
    seed: null
    # FLUX.1-schnellは公式サンプルでこの値（256）を用いて蒸留・検証されている。
    # 超えるとプロンプトが切り捨てられるか、学習時と異なる長さとして扱われ品質が不安定になりうる。
    max_sequence_length: 256
    # 任意のプロンプト追記文字列。プロンプト末尾に ", <prompt_suffix>" として付加される。
    # 既定（未指定時）は空文字列（何も付加しない）。
    # FLUX.1-schnellはguidance_scale=0.0の蒸留モデルのためnegative_promptが効かないため、
    # 画面内への意図しない文字描画を防ぐ制約などもこちらで指定する（例: "No text."）。
    prompt_suffix: "No text."
    enable_cpu_offload: false
    enable_attention_slicing: false
    low_vram_mode: true
    # nullの場合はHugging Faceの既定キャッシュ（%USERPROFILE%\.cache\huggingface\hub）を使用する
    model_cache_dir: huggingface\model_cache\FLUX.1-schnell
    # trueにしない限り、GPU未検出時にCPUへ自動フォールバックしない（意図しない長時間停止を防止）
    allow_cpu: false
    # 明示しない限りAPIへは自動フォールバックしない（意図しないAPI課金を防止）。例: bfl / openai
    fallback_provider: null
  # Qwen-Image Self-host（ローカルGPU実行）用の設定。
  # providers.image（またはproviders.image.scene/thumbnail）を qwen_image_local に
  # した場合のみ使用される。詳細はREADME.mdの「Qwen-Image Self-host」を参照。
  qwen_image_local:
    model_id: Qwen/Qwen-Image
    # auto: CUDA検出時はcuda、未検出時はallow_cpu次第でcpu / cuda / cpu / mps を明示指定も可
    device: auto
    # auto: cuda時はbfloat16、cpu時はfloat32 / float16 / bfloat16 / float32 も指定可
    dtype: auto
    # Qwen-Imageの公式サンプルはnum_inference_steps=50, true_cfg_scale=4.0を使用。
    # 字幕・キャプション風の文字が画面内へ写り込む問題を抑えるため、公式既定値より
    # 引き上げてnegative_promptへの追従を強めている（上げすぎると彩度・コントラストが
    # 過剰になる副作用があるため、6.0〜7.0程度を目安にする）。
    num_inference_steps: 20
    true_cfg_scale: 4.0
    # モデルへ渡す生成サイズ（scene_size/thumbnail_sizeとは独立）。シーン画像生成用途では
    # この解像度のまま保存され、scene_size（例:1920x1080）への整形は行わない（動画レンダリング時に
    # ffmpegのscaleフィルタで最終解像度へ引き伸ばされるため）。サムネイル用途ではレンダリング側で
    # リサイズされないため、従来どおりthumbnail_sizeへcover+中央クロップで整形される。
    width: 1664
    height: 928
    # nullの場合は毎回ランダムなseedを使用し、実際に使用したseedをログ・画像メタデータへ記録する
    seed: null
    # YouTubeロゴ・UI風の透かしや額縁構図、字幕・キャプション風の文字、レターボックス帯が
    # 写り込む問題への対策としてtrue negative guidanceを指定。特定の言語（日本語・中国語等）に
    # 限定せず、あらゆる言語の文字・記号を対象とする（プロンプトから元の日本語文を除いても、
    # モデルが文字の見た目だけをハルシネーションで生成し、言語が中国語風に化けることがあるため）。
    # "characters"は人物（登場人物）と誤解されるリスクがあるため"text characters"と明示している。
    # アニメ調イラストが、学習データ由来のアニメ動画スクリーンショット（黒帯＋タイトルカード風の
    # 文字）を誤って再現する既知の傾向があるため、anime screenshot/episode preview card等の
    # 語も追加。ポジティブプロンプト側でも「動画のワンシーンではなくスタンドアロンのイラストで
    # ある」旨を明示しており、両輪で対策している（テンプレート差分のためtemplates/<template>/
    # image_prompt.txt側に記載。image_prompt_builder.pyは共通部品のため汎用的な内容のみ）。
    # 屋内・屋外など複数の場所が1枚の画像内に混在する問題への対策も追加している
    # （positive prompt側では具体的な名詞を例示すると逆にその構図へ誘導されやすいため、
    # image_prompt_builder.pyのSetting指示は抽象的な表現のみとし、具体的な抑制はこちら側で行う）。
    # 顔の目の下あたりに不自然な筋が生成される問題への対策としてunder-eye lines等を追加。
    # true_cfg_scale 4.0/6.0どちらでも同様に発生することを確認済みのため、CFG値ではなく
    # negative_prompt側で直接抑制する。
    negative_prompt: "watermark, logo, YouTube logo, brand logo, real-world brand logos, recognizable trademarks, corporate branding, product branding, Apple logo, Windows logo, Microsoft logo, Google logo, Samsung logo, Sony logo, Nike logo, text overlay, on-screen text, subtitle, caption, written words, letters, text characters, glyphs, symbols, numbers, calligraphy, handwriting, any language script, video player interface, UI elements, screenshot, anime screenshot, episode preview card, title card, broadcast slate, next episode preview, aspect ratio label, picture frame, framed photo, border, wall-mounted display, television screen, letterbox, pillarbox, black bars, cinemascope bars, film strip border, multiple locations in one image, two different places combined, composite scene, chyron, lower third, news ticker, breaking news banner, under-eye lines, tear trough, dark circles, facial creases, skin wrinkles, facial blemishes"
    # 任意のプロンプト追記文字列。プロンプト末尾に ", <prompt_suffix>" として付加される。
    # 既定（未指定時）は空文字列（何も付加しない）。
    # 例: Qwen-Image公式ドキュメント推奨の品質向上用決まり文句や、画面内への意図しない
    # 文字描画を防ぐ制約など。
    # "cinematic"はレターボックス帯（上下の黒帯）を誘発する疑いがあるため意図的に外している。
    prompt_suffix: "Ultra HD, 4K, sharp focus."
    enable_cpu_offload: false
    enable_attention_slicing: false
    low_vram_mode: true
    # nullの場合はHugging Faceの既定キャッシュ（%USERPROFILE%\.cache\huggingface\hub）を使用する
    model_cache_dir: huggingface\model_cache\Qwen-Image
    # trueにしない限り、GPU未検出時にCPUへ自動フォールバックしない（意図しない長時間停止を防止）
    allow_cpu: false
    # 明示しない限りAPIへは自動フォールバックしない（意図しないAPI課金を防止）。例: bfl / openai
    fallback_provider: null
    # 生成画像の上下端に黒帯（レターボックス）を検出した場合、別seedで自動再生成するか。
    # falseにすると検出・再生成を行わず常に1回のみ生成する（seedを固定している場合は
    # 再生成しても同じ画像になるため、trueでも検出時は警告ログのみで再生成しない）。
    letterbox_detection_enabled: false
    # Qwen-Image-Lightning LoRA（https://huggingface.co/lightx2v/Qwen-Image-Lightning）を
    # 有効にすると8 stepsでの高速推論になる（公式実測で12〜25倍高速。ただし細かい質感・
    # 密集した文字表現の精度は下がる場合がある）。有効化する場合はnum_inference_steps: 8、
    # true_cfg_scale: 1.0を併せて設定すること（公式推奨値。異なる値のままだと起動時に
    # 警告ログを出す）。true_cfg_scale=1.0はnegative_promptによる負のガイダンスを実質
    # 無効化するため、上記negative_promptで抑制している透かし・字幕風文字の写り込み対策が
    # 弱まる可能性がある点に注意（既存の生成品質を変えないため既定はfalse）。
    lightning_lora_enabled: false
    lightning_lora_repo_id: lightx2v/Qwen-Image-Lightning
    lightning_lora_weight_name: Qwen-Image-Lightning-8steps-V2.0.safetensors
  # Qwen-Image nunchaku(SVDQuant 4bit量子化)版 Self-host（ローカルGPU実行）用の設定。
  # providers.image（またはproviders.image.scene/thumbnail）を qwen_image_nunchaku_local に
  # した場合のみ使用される。CUDA専用（CPU実行は非対応）。詳細はREADME.mdの
  # 「Qwen-Image nunchaku Self-host」を参照。
  qwen_image_nunchaku_local:
    base_model_id: Qwen/Qwen-Image
    transformer_repo_id: nunchaku-tech/nunchaku-qwen-image
    # auto: nunchaku.utils.get_precision()でGPU世代から自動判定
    # （Blackwell/50シリーズはnvfp4、それ以外はint4）。int4 / nvfp4 も明示指定可。
    precision: auto
    # 32: 高速（軽量） / 128: 高品質（重い）
    rank: 32
    # 公式サンプルのしきい値（GB）。GPU VRAMがこれを超える場合はenable_model_cpu_offload、
    # 以下の場合はtransformer.set_offload+enable_sequential_cpu_offloadを使う。
    offload_threshold_gb: 18.0
    # 低VRAM時（offload_threshold_gb以下）のtransformer.set_offload()に渡すパラメータ。
    # 公式サンプルの既定値。use_pin_memory: trueにすると環境によってはpin_memory()確保時に
    # CUDAメモリ不足で失敗することがある。
    low_vram_use_pin_memory: false
    low_vram_num_blocks_on_gpu: 1
    num_inference_steps: 50
    # Qwen-Imageの公式サンプルはtrue_cfg_scale=4.0を使用。字幕・キャプション風の文字が
    # 画面内へ写り込む問題を抑えるため、公式既定値より引き上げてnegative_promptへの
    # 追従を強めている（上げすぎると彩度・コントラストが過剰になる副作用があるため、
    # 6.0〜7.0程度を目安にする）。
    true_cfg_scale: 6.0
    # モデルへ渡す生成サイズ（scene_size/thumbnail_sizeとは独立）。シーン画像生成用途では
    # この解像度のまま保存され、scene_size（例:1920x1080）への整形は行わない（動画レンダリング時に
    # ffmpegのscaleフィルタで最終解像度へ引き伸ばされるため）。サムネイル用途ではレンダリング側で
    # リサイズされないため、従来どおりthumbnail_sizeへcover+中央クロップで整形される。
    width: 1664
    height: 928
    # nullの場合は毎回ランダムなseedを使用し、実際に使用したseedをログ・画像メタデータへ記録する
    seed: null
    # YouTubeロゴ・UI風の透かしや額縁構図、字幕・キャプション風の文字、レターボックス帯が
    # 写り込む問題への対策としてtrue negative guidanceを指定。特定の言語（日本語・中国語等）に
    # 限定せず、あらゆる言語の文字・記号を対象とする（プロンプトから元の日本語文を除いても、
    # モデルが文字の見た目だけをハルシネーションで生成し、言語が中国語風に化けることがあるため）。
    # "characters"は人物（登場人物）と誤解されるリスクがあるため"text characters"と明示している。
    # アニメ調イラストが、学習データ由来のアニメ動画スクリーンショット（黒帯＋タイトルカード風の
    # 文字）を誤って再現する既知の傾向があるため、anime screenshot/episode preview card等の
    # 語も追加。ポジティブプロンプト側でも「動画のワンシーンではなくスタンドアロンのイラストで
    # ある」旨を明示しており、両輪で対策している（テンプレート差分のためtemplates/<template>/
    # image_prompt.txt側に記載。image_prompt_builder.pyは共通部品のため汎用的な内容のみ）。
    # 屋内・屋外など複数の場所が1枚の画像内に混在する問題への対策も追加している
    # （positive prompt側では具体的な名詞を例示すると逆にその構図へ誘導されやすいため、
    # image_prompt_builder.pyのSetting指示は抽象的な表現のみとし、具体的な抑制はこちら側で行う）。
    # 顔の目の下あたりに不自然な筋が生成される問題への対策としてunder-eye lines等を追加。
    # true_cfg_scale 4.0/6.0どちらでも同様に発生することを確認済みのため、CFG値ではなく
    # negative_prompt側で直接抑制する。
    negative_prompt: "watermark, logo, YouTube logo, brand logo, real-world brand logos, recognizable trademarks, corporate branding, product branding, Apple logo, Windows logo, Microsoft logo, Google logo, Samsung logo, Sony logo, Nike logo, text overlay, on-screen text, subtitle, caption, written words, letters, text characters, glyphs, symbols, numbers, calligraphy, handwriting, any language script, video player interface, UI elements, screenshot, anime screenshot, episode preview card, title card, broadcast slate, next episode preview, aspect ratio label, picture frame, framed photo, border, wall-mounted display, television screen, letterbox, pillarbox, black bars, cinemascope bars, film strip border, multiple locations in one image, two different places combined, composite scene, chyron, lower third, news ticker, breaking news banner, under-eye lines, tear trough, dark circles, facial creases, skin wrinkles, facial blemishes"
    # 任意のプロンプト追記文字列。プロンプト末尾に ", <prompt_suffix>" として付加される。
    # 既定（未指定時）は空文字列（何も付加しない）。
    # 例: Qwen-Image公式ドキュメント推奨の品質向上用決まり文句や、画面内への意図しない
    # 文字描画を防ぐ制約など。
    # "cinematic"はレターボックス帯（上下の黒帯）を誘発する疑いがあるため意図的に外している。
    prompt_suffix: "Ultra HD, 4K, sharp focus."
    # nullの場合はHugging Faceの既定キャッシュ（%USERPROFILE%\.cache\huggingface\hub）を使用する
    model_cache_dir: huggingface\model_cache\Qwen-Image-nunchaku
    # 明示しない限りAPIへは自動フォールバックしない（意図しないAPI課金を防止）。例: bfl / openai
    fallback_provider: null
    # 生成画像の上下端に黒帯（レターボックス）を検出した場合、別seedで自動再生成するか。
    # falseにすると検出・再生成を行わず常に1回のみ生成する（seedを固定している場合は
    # 再生成しても同じ画像になるため、trueでも検出時は警告ログのみで再生成しない）。
    letterbox_detection_enabled: false

# 台本のシーン分割設定
scenes:
  # 台本分割時の最大シーン数
  max_count: 30

# ナレーション音声の設定
audio:
  # 音声合成に使用するモデル
  model: gpt-4o-mini-tts
  # 読み上げ音声
  voice: alloy
  # 読み上げ速度
  speed: 1.0
  # 音声合成モデルへの読み上げ指示
  instructions: 自然で聞き取りやすい日本語ナレーションとして話してください。
  voicevox:
    base_url: http://127.0.0.1:50021
    speaker_id: 3
    timeout: 30
    speed_scale: 1.0
    pitch_scale: 0.0
    intonation_scale: 1.0
    volume_scale: 1.0
    pre_phoneme_length: 0.1
    post_phoneme_length: 0.1

# BGMの設定
bgm:
  # BGMを動画へ追加するか
  enabled: false
  # BGMファイルのパス
  path: assets/bgm.mp3
  # BGMの音量
  volume: 0.15
  # テンプレートに設定がない場合のフォールバック先（path/volumeの別名）
  default_file: assets/bgm.mp3
  default_volume: 0.15
  loop: true
  fade_in: 1.0
  fade_out: 2.0
  missing_file_behavior: fallback
  # per_section: 本編・エンディング別にミックス / final_mix: 最終段階で一度だけミックス
  render_mode: per_section
  ducking:
    enabled: false
    volume_during_speech: 0.04
    attack: 0.2
    release: 0.5

# final_mix時の結合済み中間動画を保持するか
final_render:
  keep_intermediate: true

# 字幕表示の設定
subtitles:
  # 字幕に使用するフォント
  font: Arial
  # 字幕の文字サイズ
  size: 24
  # 字幕色（ASS形式）
  color: "&H00FFFFFF"
  segmentation_mode: semantic
  max_lines: 2
  max_chars_per_line: 20
  min_chars_per_segment: 6
  # alignment: sceneNN.alignment.json を優先。未配置・不正時は character_ratio へフォールバック
  timing_mode: alignment
  # timing_mode: alignment 時に sceneNN.alignment.json を生成するプロバイダー設定
  alignment_provider:
    provider: stable_ts
    language: ja
    model: base
  fallback_timing_mode: character_ratio
  position: bottom
  # 字幕の水平配置（center / left / right）。上のalignment_providerとは無関係
  alignment: center
  bottom_margin: 80
  # 字幕を囲む背景ボックスを表示するか
  box_enabled: false
  # 字幕背景色（#RRGGBB または ASS形式）
  background_color: "#000000"
  # 字幕背景の不透明度（0.0～1.0）
  background_opacity: 0.6

# YouTubeメタデータ生成の設定
metadata:
  # 生成するタイトル候補数
  title_count: 10

# 台本および動画素材の品質チェック設定
quality:
  # 台本の最小文字数
  min_characters: 1000
  # 台本の最大文字数
  max_characters: 4000
  # 動画時間の推定に使用する1秒あたりの文字数
  characters_per_second: 6.0
  # 台本で使用を禁止する表現
  forbidden_words:
    - 必ず儲かる
    - 絶対に治る
  # 同一文を重複と判定する出現回数
  duplicate_sentence_threshold: 2

# 外部APIへのリトライ設定
retry:
  # API呼び出しの最大試行回数
  max_attempts: 5
  # 最初の再試行までの待機秒数
  initial_wait_seconds: 1.0
  # 再試行間隔に掛ける倍率
  backoff_multiplier: 2.0
  # API呼び出しのタイムアウト秒数
  timeout_seconds: 60

# 生成済み成果物のキャッシュ設定
cache:
  # キャッシュを使用するか
  enabled: true
  # キャッシュを保持する日数
  expiration_days: 30

# テンプレートごとに再利用する共通エンディング設定
ending:
  enabled: true
  subtitles:
    enabled: false
  auto_append: true
  min_duration: 5
  max_duration: 20
  # 本編映像の末尾に追加する無音の余白（秒）
  gap_seconds: 1.0
  # 本編終了時の画面フェードアウト秒数（音声は対象外。0で無効。エンディング未結合時は常に無効）
  main_fade_out_seconds: 0.5
  # エンディング映像の冒頭に追加する無音の余白（秒）
  start_padding_seconds: 0.5
  # エンディング開始時の画面フェードイン秒数（音声は対象外。0で無効）
  fade_in_seconds: 0.5
  # エンディング映像の末尾に追加する無音の余白（秒）
  end_padding_seconds: 1.0
  max_reference_text_chars: 10000
  image_mode: sequence

# ジョブキューの設定
queue:
  # 1件の失敗時に後続ジョブの処理も停止するか
  stop_on_error: false
  # キュー実行時にサムネイル生成工程をスキップするか
  skip_thumbnail: false

# YouTubeアップロードの設定
youtube:
  # 動画の既定公開範囲
  default_privacy: private
  # YouTubeのカテゴリID
  category_id: 22
  # 実際のYouTubeアップロードを許可するか
  upload_enabled: false
