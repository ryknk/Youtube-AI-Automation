display_name: 歴史
scene_structure: [時代背景, 出来事の発端, 展開, 影響とまとめ]
bgm:
  enabled: false
  render_mode: per_section
  file: assets/bgm.mp3
  volume: 0.08
  loop: true
  fade_in: 1.0
  fade_out: 2.0
  missing_file_behavior: fallback
audio:
  voicevox:
    speaker_id: 3
    speed_scale: 1.0
    pitch_scale: 0.0
    intonation_scale: 1.0
    volume_scale: 1.0
    pre_phoneme_length: 0.1
    post_phoneme_length: 0.1
