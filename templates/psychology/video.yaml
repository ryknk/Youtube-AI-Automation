display_name: 心理学
scene_structure: [悩みの提示, 心理学的背景, 実践例, まとめ]
subtitles:
  font: Arial
  size: 24
  color: "&H00FFFFFF"
  segmentation_mode: semantic
  max_lines: 2
  max_chars_per_line: 20
  min_chars_per_segment: 6
  timing_mode: alignment
  fallback_timing_mode: character_ratio
  position: bottom
  alignment: center
  bottom_margin: 80
bgm:
  enabled: false
  render_mode: per_section
  file: assets/bgm.mp3
  volume: 0.08
  loop: true
  fade_in: 1.0
  fade_out: 2.0
  missing_file_behavior: fallback
audio:
  voicevox:
    speaker_id: 2
    speed_scale: 1.0
    pitch_scale: 0.0
    intonation_scale: 1.0
    volume_scale: 1.0
    pre_phoneme_length: 0.1
    post_phoneme_length: 0.1
