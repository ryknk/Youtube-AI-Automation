[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-ai-automation"
version = "0.1.0"
description = "Youtube AI Automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "openai>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "google-api-python-client>=2.0,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "Pillow>=10.0,<12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-mock>=3.14,<4.0",
]
# FLUX.1 Schnell Self-host（ローカルGPU画像生成）用の任意依存関係。
# 通常利用者（BFL/OpenAI画像プロバイダーのみ使用）にはインストール不要。
# 導入手順・GPU/CUDA確認方法はREADME.mdを参照。
flux-local = [
    "torch>=2.2",
    "diffusers>=0.30",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
# Qwen-Image Self-host（ローカルGPU画像生成）用の任意依存関係。
# 通常利用者（BFL/OpenAI画像プロバイダーのみ使用）にはインストール不要。
# 導入手順・GPU/CUDA確認方法はREADME.mdを参照。
qwen-image-local = [
    "torch>=2.2",
    "diffusers>=0.30",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
# Qwen-Image nunchaku(SVDQuant 4bit量子化)版 Self-host用の任意依存関係。
# nunchaku本体は通常のpip install nunchakuでは導入できず、torch/CUDA/Pythonバージョンに
# 対応したプリビルドwheelを https://github.com/nunchaku-tech/nunchaku/releases から
# 個別にインストールする必要がある。導入手順はREADME.mdを参照。
# diffusersは0.36.0に固定（動作確認済み。より新しいバージョンではnunchakuとの
# 非互換エラーを確認している。詳細はREADME.mdを参照）。
qwen-image-nunchaku-local = [
    "torch>=2.2",
    "diffusers==0.36.0",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
]

[project.scripts]
youtube-ai-automation = "youtube_generator.cli.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: isolated unit test with no external service",
    "integration: multi-module test with mocked external dependencies",
    "slow: test that is comparatively slow",
    "external: opt-in test that may contact an external service",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["youtube_generator"]
